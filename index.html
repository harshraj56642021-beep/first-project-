<!DOCTYPE html>
<html>
<head>
    <title>Transport Billing System</title>
</head>
<body>

    <h2>all Transport - Billing Dashboard</h2>
    
    <form>
        <label>Driver Ka Naam:</label><br>
        <input type="text" placeholder="Naam likhein"><br><br>

        <label>Gaadi Number:</label><br>
        <input type="text" placeholder="Jaise: HR 26 XX 0000"><br><br>

        <label>Total Kilometers:</label><br>
        <input type="number" placeholder="Kitne KM chale?"><br><br>

        <label>Toll Tax / Extra Kharch (₹):</label><br>
        <input type="number" placeholder="Agar koi kharch ho"><br><br>

        <button type="button">Bill Generate Karein</button>
    </form>

</body>
