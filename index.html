<!DOCTYPE html>
<html>
<head>
    <title>Transport Billing System</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            text-align: center;
            padding: 20px;
        }

        form {
            background-color: white;
            max-width: 350px;
            margin: 0 auto; 
            padding: 25px;
            border-radius: 12px; 
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1); 
            text-align: left;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background-color: #28a745; 
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
        }

        button:hover {
            background-color: #218838;
        }

        #status {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2> Transport - Billing Dashboard</h2>
    
    <form id="billingForm">
        <label>Driver Ka Naam:</label><br>
        <input type="text" id="driverName" placeholder="Naam likhein" required><br>

        <label>Gaadi Number:</label><br>
        <input type="text" id="gaadiNumber" placeholder="Jaise: HR 26 XX 0000" required><br>

        <label>Total Kilometers:</label><br>
        <input type="number" id="kms" placeholder="Kitne KM chale?" required><br>

        <label>Toll Tax Total (₹):</label><br>
        <input type="number" id="toll" placeholder="Sabhi toll ka total" value="0"><br>

        <label>Parking Charge (₹):</label><br>
        <input type="number" id="parking" placeholder="Parking ka kharch" value="0"><br>

        <label>Extra Kharcha (₹):</label><br>
        <input type="number" id="extra" placeholder="Chai/Pani ya anya kharch" value="0"><br>

        <button type="button" onclick="calculateAndSubmitBill()">Bill Generate & Save Karein</button>
    </form>

    <br>
    <h3 id="finalResult" style="color: blue;"></h3>
    <p id="status"></p>

    <script>
        // Google Apps Script Web App Link
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxYN4iqZhTY6CBiBIC735xJwXQFTzKk-TZvPPLs4cHJ7q-uYnIzLM7hzMtIl8dEoco/exec';

        function calculateAndSubmitBill() {
            let name = document.getElementById("driverName").value;
            let gaadi = document.getElementById("gaadiNumber").value;
            let km = document.getElementById("kms").value;
            let toll = document.getElementById("toll").value || 0;
            let parking = document.getElementById("parking").value || 0;
            let extra = document.getElementById("extra").value || 0;

            if(!name || !gaadi || !km) {
                alert("Kripya Naam, Gaadi Number aur Kilometers zaroor bharein!");
                return;
            }

            // Calculation
            let ratePerKm = 50; 
            let totalExpenses = Number(toll) + Number(parking) + Number(extra);
            let totalBill = (Number(km) * ratePerKm) + totalExpenses;

            // Result Screen par dikhana
            document.getElementById("finalResult").innerHTML = 
                name + " bhai ka total bill hua: ₹" + totalBill;
            
            document.getElementById("status").style.color = "orange";
            document.getElementById("status").innerHTML = "Data Google Sheet mein save ho raha hai...";

            // Google Sheet ko data bhejna
            let formData = {
                name: name,
                gaadi: gaadi,
                km: km,
                toll: toll,
                parking: parking,
                extra: extra,
                totalBill: totalBill
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                document.getElementById("status").style.color = "green";
                document.getElementById("status").innerHTML = "✅ Data Google Sheet mein successfully save ho gaya!";
            })
            .catch(error => {
                document.getElementById("status").style.color = "red";
                document.getElementById("status").innerHTML = "❌ Error! Data save nahi ho paya.";
                console.error('Error!', error.message);
            });
        }
    </script>

</body>
</html>
